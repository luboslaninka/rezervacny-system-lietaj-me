<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezervačný systém lietaj.me — dokumentácia</title>
  <style>
    :root { --ink: #172033; --muted: #657085; --accent: #1766c2; --line: #dfe6ef; --bg: #f5f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: var(--bg); color: var(--ink); font-family: Arial, sans-serif; }
    main { width: min(760px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 48px; box-shadow: 0 12px 30px rgba(22, 41, 72, .10); }
    h1 { margin: 0 0 12px; font-size: 32px; }
    .lead { margin: 0 0 34px; color: var(--muted); font-size: 18px; line-height: 1.55; }
    .links { display: grid; gap: 14px; }
    a { display: block; padding: 20px; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
    a:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(23, 102, 194, .14); }
    strong { display: block; color: var(--accent); font-size: 19px; margin-bottom: 5px; }
    span { color: var(--muted); line-height: 1.45; }
    @media (max-width: 560px) { main { padding: 30px 22px; } h1 { font-size: 27px; } }
  </style>
</head>
<body>
  <main>
    <h1>Rezervačný systém lietaj.me</h1>
    <p class="lead">Dokumentácia a návody pre pilotov a administráciu systému.</p>
    <div class="links">

      <a href="technicka-specifikacia-rezervacie-pilotov.html">
        <strong>Technická špecifikácia</strong>
        <span>Kompletná funkčná dokumentácia modulu rezervácií pilotov.</span>
      </a>
    </div>
  </main>
</body>
</html>
